<div class="tab-pane" id="onboarding_by_highschool">
    <div class="bg-white border border-top-0 p-3">
        {% include "student_onboarding/ce/_term_select.html" with tab_id="onboarding_by_highschool" %}
        <table id="onboarding_by_highschool_table" class="table table-striped" style="width:100%">
            <thead>
                <tr>
                    <th>High School</th>
                    <th>Total</th>
                    <th>Completed</th>
                    <th>Pending</th>
                    <th>%</th>
                </tr>
            </thead>
        </table>
    </div>
    <script>
        $(function () {
            var dt = null;
            function apiUrl() {
                return '/ce/onboarding/api/by_highschool/?term_id=' + $('#onboarding_by_highschool_term').val();
            }
            function init() {
                dt = $('#onboarding_by_highschool_table').DataTable({
                    stateSave: true,
                    ajax: apiUrl(),
                    pageLength: 50,
                    order: [[4, 'desc']],
                    dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                    buttons: [
                        {
                            extend: 'csv', className: 'btn btn-sm btn-primary text-white text-light',
                            text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV',
                            titleAttr: 'Export Records in Current View to CSV'
                        },
                        {
                            extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                            text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                            titleAttr: 'Print Records in Current View'
                        }
                    ],
                    columns: [
                        { data: 'highschool' },
                        { data: 'total' },
                        { data: 'completed' },
                        { data: 'pending' },
                        {
                            data: 'percent',
                            render: function (d) {
                                return '<div class="progress" style="min-width:80px;"><div class="progress-bar" style="width:' + d + '%;">' + d + '%</div></div>';
                            }
                        }
                    ]
                });
            }
            $('a[data-toggle="tab"][href="#onboarding_by_highschool"]').one('shown.bs.tab', init);
            $('#onboarding_by_highschool_term').on('change', function () {
                if (dt) dt.ajax.url(apiUrl()).load();
            });
        });
    </script>
</div>
