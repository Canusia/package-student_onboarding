<div class="tab-pane" id="onboarding_by_student">
    <div class="bg-white border border-top-0 p-3">
        {% include "student_onboarding/ce/_term_select.html" with tab_id="onboarding_by_student" %}
        <form class="form-inline mb-2" id="onboarding_by_student_step_filter" onsubmit="return false;">
            <label class="mr-2" for="onboarding_by_student_step">Item:</label>
            <select id="onboarding_by_student_step" class="form-control form-control-sm mr-2">
                <option value="">All students</option>
            </select>
            <label class="mr-2" for="onboarding_by_student_step_status">Status:</label>
            <select id="onboarding_by_student_step_status" class="form-control form-control-sm mr-2">
                <option value="pending">Pending</option>
                <option value="completed">Completed</option>
                <option value="not_applicable">Not Applicable</option>
            </select>
            <button type="button" class="btn btn-sm btn-light d-none" id="onboarding_by_student_step_clear">Clear filter</button>
        </form>
        <div class="mb-4" style="height: 260px;">
            <canvas id="onboarding_by_student_funnel"></canvas>
        </div>
        <p class="small text-muted mb-3">Click a bar to list the students with that item in that status.</p>
        <table id="onboarding_by_student_table" class="table table-striped responsive" style="width:100%">
            <thead>
                <tr>
                    <th></th>
                    <th>Started</th>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Email</th>
                    <th>High School</th>
                    <th>Progress</th>
                    <th>Pending</th>
                    <th>Last Progress</th>
                    <th>Last Notified</th>
                    <th></th>
                </tr>
            </thead>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        $(function () {
            var bulkActionsUrl = '{% url "cis:student_bulk_actions" %}';
            var dt = null;
            var funnelChart = null;
            var funnelRows = [];
            var STATUSES = ['completed', 'pending', 'not_applicable'];  // dataset order below
            function filterParams() {
                var params = 'term_id=' + encodeURIComponent($('#onboarding_by_student_term').val() || '');
                var step = $('#onboarding_by_student_step').val();
                if (step) {
                    params += '&step=' + encodeURIComponent(step)
                        + '&step_status=' + encodeURIComponent($('#onboarding_by_student_step_status').val());
                }
                return params;
            }
            function apiUrl() {
                return '/ce/onboarding/api/by_student/?format=datatables&' + filterParams();
            }
            function exportUrl() {
                var q = dt ? dt.search() : '';
                return '/ce/onboarding/api/by_student/export/?' + filterParams()
                    + (q ? '&q=' + encodeURIComponent(q) : '');
            }
            function fillStepOptions(rows) {
                var select = $('#onboarding_by_student_step');
                var current = select.val();
                select.find('option:not(:first)').remove();
                rows.forEach(function (r) {
                    select.append($('<option>').val(r.key).text(r.label || r.key));
                });
                select.val(rows.some(function (r) { return r.key === current; }) ? current : '');
                $('#onboarding_by_student_step_clear').toggleClass('d-none', !select.val());
            }
            function applyStepFilter() {
                $('#onboarding_by_student_step_clear').toggleClass(
                    'd-none', !$('#onboarding_by_student_step').val());
                if (dt) dt.ajax.url(apiUrl()).load();
            }
            function funnelUrl() {
                return '/ce/onboarding/api/funnel/?term_id=' + $('#onboarding_by_student_term').val();
            }
            function loadFunnel() {
                $.getJSON(funnelUrl(), function (rows) {
                    funnelRows = rows;
                    fillStepOptions(rows);
                    var labels = rows.map(function (r) { return r.label || r.key; });
                    var completed = rows.map(function (r) { return r.completed; });
                    var pending = rows.map(function (r) { return r.pending; });
                    var na = rows.map(function (r) { return r.not_applicable; });
                    if (funnelChart) funnelChart.destroy();
                    funnelChart = new Chart(document.getElementById('onboarding_by_student_funnel'), {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: 'Completed', data: completed, backgroundColor: '#28a745' },
                                { label: 'Pending', data: pending, backgroundColor: '#ffc107' },
                                { label: 'Not Applicable', data: na, backgroundColor: '#6c757d' }
                            ]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            onClick: function (evt, elements) {
                                if (!elements || !elements.length) return;
                                var row = funnelRows[elements[0].index];
                                if (!row) return;
                                $('#onboarding_by_student_step').val(row.key);
                                $('#onboarding_by_student_step_status').val(STATUSES[elements[0].datasetIndex]);
                                applyStepFilter();
                            },
                            onHover: function (evt, elements) {
                                evt.native.target.style.cursor = elements && elements.length ? 'pointer' : 'default';
                            },
                            scales: {
                                x: { stacked: true, beginAtZero: true },
                                y: { stacked: true }
                            }
                        }
                    });
                });
            }
            function init() {
                if ($.fn.dataTable.isDataTable('#onboarding_by_student_table')) {
                    return;
                }
                loadFunnel();
                dt = $('#onboarding_by_student_table').DataTable({
                    stateSave: true,
                    serverSide: true,
                    processing: true,
                    ajax: apiUrl(),
                    lengthMenu: [30, 50, 100],
                    order: [[1, 'desc']],
                    rowId: 'student_id',
                    columnDefs: [
                        { orderable: false, className: 'select-checkbox', targets: 0 }
                    ],
                    select: { style: 'os', selector: 'td:first-child' },
                    dom: 'B<"float-left mt-3 mb-3"l><"float-right mt-3"f><"row clear">rt<"row"<"col-6"i><"col-6 float-right"p>>',
                    buttons: [
                        {
                            className: 'btn btn-sm btn-primary text-white text-light',
                            text: '<i class="fas fa-file-csv text-white"></i>&nbsp;CSV (all rows)',
                            titleAttr: 'Export every row matching the filters and search to CSV',
                            action: function () { window.location = exportUrl(); }
                        },
                        {
                            extend: 'print', className: 'btn btn-sm btn-primary text-white text-light',
                            text: '<i class="fas fa-print text-white"></i>&nbsp;Print',
                            titleAttr: 'Print Records in Current View'
                        },
                        {
                            className: 'btn btn-sm btn-primary text-white text-light',
                            text: '<i class="fa fa-envelope text-white"></i>&nbsp;Send Verification Link',
                            titleAttr: 'Send Verification Link',
                            action: function (e, d) {
                                ActionRegistry.doBulkAction(bulkActionsUrl, 'resend_verification_link', d);
                            }
                        },
                        {
                            className: 'btn btn-sm btn-primary text-white text-light',
                            text: '<i class="fa fa-link text-white"></i>&nbsp;Get Verification Link',
                            titleAttr: 'Get Verification Link',
                            action: function (e, d) {
                                ActionRegistry.doBulkAction(bulkActionsUrl, 'get_verification_link', d);
                            }
                        }
                    ],
                    columns: [
                        // Must send a non-empty data key: rest_framework_datatables stops
                        // reading columns at the first empty one, so `data: null` here
                        // silently dropped all search and ordering (#7).
                        {
                            data: 'student_id', defaultContent: '', orderable: false, searchable: false,
                            render: function () { return ''; }
                        },
                        { data: 'started_on', name: 'started_on' },
                        { data: 'last_name', name: 'student.user.last_name' },
                        { data: 'first_name', name: 'student.user.first_name' },
                        { data: 'email', name: 'student.user.email' },
                        { data: 'highschool', name: 'student.highschool.name' },
                        {
                            data: 'progress_percent', name: 'completed_steps',
                            render: function (d, type, row) {
                                return '<div class="progress" style="min-width:80px;"><div class="progress-bar" style="width:' + d + '%;">' + d + '%</div></div>';
                            }
                        },
                        {
                            data: 'pending_steps', orderable: false, searchable: false,
                            render: function (d) {
                                return (d || []).join(', ');
                            }
                        },
                        { data: 'last_step_completed_on', orderable: false, searchable: false },
                        { data: 'last_notified_on', name: 'last_notified_on' },
                        {
                            data: 'student_id', orderable: false, searchable: false,
                            render: function (d) {
                                return "<a class='btn btn-sm btn-primary record-details' refresh-target='table' href='/ce/student/" + d + "'>View Details</a>";
                            }
                        }
                    ]
                });
            }
            // The host shows a deep-linked tab before this callback runs, so
            // shown.bs.tab may already have fired (#3). init() is idempotent.
            $('a[data-toggle="tab"][href="#onboarding_by_student"]').one('shown.bs.tab', init);
            if ($('#onboarding_by_student').hasClass('active')) init();
            $('#onboarding_by_student_term').on('change', function () {
                loadFunnel();
                if (dt) dt.ajax.url(apiUrl()).load();
            });
            $('#onboarding_by_student_step, #onboarding_by_student_step_status').on('change', applyStepFilter);
            $('#onboarding_by_student_step_clear').on('click', function () {
                $('#onboarding_by_student_step').val('');
                $('#onboarding_by_student_step_status').val('pending');
                applyStepFilter();
            });
        });
    </script>
</div>
