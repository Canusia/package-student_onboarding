<div class="tab-pane" id="onboarding_stalled">
    <div class="bg-white border border-top-0 p-3">
        {% include "student_onboarding/ce/_term_select.html" with tab_id="onboarding_stalled" %}
        <form id="onboarding_stalled_filter" class="form-inline mb-2">
            <label class="mr-2">Days without progress:</label>
            <input type="number" min="1" max="365" value="7" id="onboarding_stalled_days" class="form-control form-control-sm" style="width:80px;" />
            <button type="button" id="onboarding_recalc_all" class="btn btn-sm btn-outline-primary ml-3">
                <i class="fas fa-sync"></i> Recalculate all shown
            </button>
        </form>
        <table id="onboarding_stalled_table" class="table table-striped" style="width:100%">
            <thead>
                <tr>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Email</th>
                    <th>High School</th>
                    <th>Started</th>
                    <th>Last Progress</th>
                    <th>Last Notified</th>
                    <th>Progress</th>
                    <th></th>
                </tr>
            </thead>
        </table>
    </div>
    <script>
        $(function () {
            var dt = null;
            function apiUrl() {
                var days = $('#onboarding_stalled_days').val() || 7;
                var term = $('#onboarding_stalled_term').val();
                return '/ce/onboarding/api/stalled/?days=' + days + '&term_id=' + term;
            }
            function load() {
                if (dt) {
                    dt.ajax.url(apiUrl()).load();
                    return;
                }
                dt = $('#onboarding_stalled_table').DataTable({
                    stateSave: true,
                    ajax: apiUrl(),
                    pageLength: 50,
                    order: [[4, 'asc']],
                    columns: [
                        { data: 'last_name' },
                        { data: 'first_name' },
                        { data: 'email' },
                        { data: 'highschool' },
                        { data: 'started_on' },
                        { data: 'last_step_completed_on' },
                        { data: 'last_notified_on' },
                        {
                            data: 'progress_percent',
                            render: function (d) {
                                return d + '%';
                            }
                        },
                        {
                            data: 'student_id',
                            orderable: false,
                            searchable: false,
                            render: function (d) {
                                return $('<button type="button" class="btn btn-sm btn-outline-primary onboarding-recalc-row"><i class="fas fa-sync"></i> Recalculate</button>')
                                    .attr('data-student-id', d).prop('outerHTML');
                            }
                        }
                    ]
                });
            }
            var busy = false;
            function setBusy(on) {
                busy = on;
                $('#onboarding_recalc_all, .onboarding-recalc-row').prop('disabled', on);
            }
            function recalc(ids) {
                if (!ids.length || busy) return;
                setBusy(true);
                $.ajax({
                    type: 'POST',
                    url: '/ce/onboarding/api/recalculate/',
                    data: { 'student_ids[]': ids, 'term_id': $('#onboarding_stalled_term').val() },
                    headers: { 'X-CSRFToken': window.CSRF_TOKEN || '{{ csrf_token }}' },
                    traditional: true
                }).done(function (r) {
                    var msg = r.processed + ' processed, ' + r.skipped + ' skipped; ' +
                        r.completed + ' completed, ' + r.reopened + ' reopened, ' +
                        r.seeded + ' added' + (r.failed ? ', ' + r.failed + ' failed.' : '.');
                    if (window.swal) { swal('Onboarding', msg, 'success'); } else { alert(msg); }
                    load();
                }).fail(function () {
                    if (window.swal) { swal('Error', 'Recalculation failed.', 'error'); } else { alert('Recalculation failed.'); }
                }).always(function () {
                    setBusy(false);
                });
            }
            $('#onboarding_stalled_table').on('click', '.onboarding-recalc-row', function () {
                recalc([$(this).data('student-id')]);
            });
            $('#onboarding_recalc_all').on('click', function () {
                if (!dt) return;
                var ids = dt.rows({ page: 'current', search: 'applied' }).data().toArray()
                    .map(function (row) { return row.student_id; });
                recalc(ids);
            });
            // The host shows a deep-linked tab before this callback runs, so
            // shown.bs.tab may already have fired (#3).
            var started = false;
            function start() {
                if (started) return;
                started = true;
                load();
            }
            $('a[data-toggle="tab"][href="#onboarding_stalled"]').one('shown.bs.tab', start);
            if ($('#onboarding_stalled').hasClass('active')) start();
            $('#onboarding_stalled_days').on('change', load);
            $('#onboarding_stalled_term').on('change', load);
        });
    </script>
</div>
